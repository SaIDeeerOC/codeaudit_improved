# Gitea Actions / GitLab CI (self-hosted): запуск на каждый push и merge request
name: quality-audit
on: [push, pull_request]
jobs:
  audit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}      # нужна вся история для аудита Git
      - run: python3 -m unittest discover -s tests -v
      - run: python3 pipeline.py . --out report --config config.toml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: audit-report, path: report/}
